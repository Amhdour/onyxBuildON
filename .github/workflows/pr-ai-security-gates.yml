name: PR AI Security Gates
concurrency:
  group: PR-AI-Security-Gates-${{ github.workflow }}-${{ github.head_ref || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

on:
  merge_group:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'backend/onyx/security_layer/**'
      - 'backend/tests/security_layer/**'
      - 'web/src/app/admin/security/**'
      - '.github/workflows/pr-ai-security-gates.yml'

permissions:
  contents: read

jobs:
  security-policy-schema:
    runs-on:
      - runs-on
      - runner=2cpu-linux-arm64
      - ${{ format('run-id={0}-security-policy-schema', github.run_id) }}
    timeout-minutes: 20
    steps:
      - uses: runs-on/action@d141ef83eb66d096ce8afc767e09115a65c63b60
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-and-install-dependencies
        with:
          requirements: |
            backend/requirements/default.txt
            backend/requirements/dev.txt
            backend/requirements/ee.txt
      - name: Validate security YAML policies
        env:
          PYTHONPATH: ./backend
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from onyx.security_layer.policy.loader import load_policy_directory

          policy_dir = Path('backend/onyx/security_layer/policies')
          policies = load_policy_directory(policy_dir)
          assert policies, 'No policies loaded from security policy directory'
          print(f'Loaded {len(policies)} security policies from {policy_dir}')
          PY

  security-unit-tests:
    needs: [security-policy-schema]
    runs-on:
      - runs-on
      - runner=2cpu-linux-arm64
      - ${{ format('run-id={0}-security-unit-tests', github.run_id) }}
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@d141ef83eb66d096ce8afc767e09115a65c63b60
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-and-install-dependencies
        with:
          requirements: |
            backend/requirements/default.txt
            backend/requirements/dev.txt
            backend/requirements/ee.txt
      - name: Run backend security layer tests
        env:
          PYTHONPATH: ./backend
        run: uv run pytest -xv backend/tests/security_layer/

  security-demo-attacks:
    needs: [security-unit-tests]
    runs-on:
      - runs-on
      - runner=2cpu-linux-arm64
      - ${{ format('run-id={0}-security-demo-attacks', github.run_id) }}
    timeout-minutes: 20
    steps:
      - uses: runs-on/action@d141ef83eb66d096ce8afc767e09115a65c63b60
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-and-install-dependencies
        with:
          requirements: |
            backend/requirements/default.txt
            backend/requirements/dev.txt
            backend/requirements/ee.txt
      - name: Run security demo attacks
        env:
          PYTHONPATH: ./backend
        run: uv run pytest -xv backend/tests/security_layer/test_demo_attacks.py

  launch-gate-report:
    needs: [security-demo-attacks]
    runs-on:
      - runs-on
      - runner=2cpu-linux-arm64
      - ${{ format('run-id={0}-launch-gate-report', github.run_id) }}
    timeout-minutes: 20
    steps:
      - uses: runs-on/action@d141ef83eb66d096ce8afc767e09115a65c63b60
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-and-install-dependencies
        with:
          requirements: |
            backend/requirements/default.txt
            backend/requirements/dev.txt
            backend/requirements/ee.txt
      - name: Generate launch-gate reports
        env:
          PYTHONPATH: ./backend
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from onyx.security_layer.launch_gates import GateStatus, LaunchGateCheck, LaunchGateEvidence, LaunchGateInput, evaluate_launch_gates, generate_launch_gate_reports

          output_dir = Path('security_reports')
          sample = LaunchGateInput(
              service_name='pr-ai-security-gates',
              checks=[LaunchGateCheck(gate_id='baseline', status=GateStatus.PASS, summary='Security baseline checks passed')],
              findings=[],
              evidence=LaunchGateEvidence(policy_decisions=[]),
          )
          result = evaluate_launch_gates(sample)
          generate_launch_gate_reports(result, output_dir)
          print(f'Generated launch gate report assets in {output_dir}')
          PY
      - name: Ensure required artifacts exist
        run: |
          test -f security_reports/launch_gate_report.json
          test -f security_reports/launch_gate_report.md
          test -f security_reports/security_findings.sarif
          test -f security_reports/audit_sample.ndjson
          test -f security_reports/policy_decisions.csv
      - name: Upload security report artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-reports-${{ github.run_id }}
          path: security_reports/
          retention-days: 7

  sarif-export:
    needs: [launch-gate-report]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Download generated security reports
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8e9d423195ad # ratchet:actions/download-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: security_reports
      - name: Upload SARIF
        if: hashFiles('security_reports/security_findings.sarif') != ''
        uses: github/codeql-action/upload-sarif@ba454b8ab46733eb6145342877cd148270bb77ab # ratchet:github/codeql-action/upload-sarif@codeql-bundle-v2.23.5
        with:
          sarif_file: security_reports/security_findings.sarif

  frontend-security-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning] test-only workflow; no deploy artifacts
        with:
          bun-version: '1.3.13'
      - name: Install node dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile
      - name: Build frontend security UI
        working-directory: ./web
        run: bun run build
