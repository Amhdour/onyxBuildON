name: Nightly AI Security Demo Attacks
concurrency:
  group: Nightly-AI-Security-Demo-Attacks-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-security-demo-attacks:
    runs-on:
      - runs-on
      - runner=2cpu-linux-arm64
      - ${{ format('run-id={0}-nightly-ai-security-demo-attacks', github.run_id) }}
    timeout-minutes: 45
    steps:
      - uses: runs-on/action@d141ef83eb66d096ce8afc767e09115a65c63b60

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-and-install-dependencies
        with:
          requirements: |
            backend/requirements/default.txt
            backend/requirements/dev.txt
            backend/requirements/ee.txt

      - name: Run all security demo attacks
        env:
          PYTHONPATH: ./backend
        run: uv run pytest -xv backend/tests/security_layer/test_demo_attacks.py

      - name: Generate full launch-gate report
        env:
          PYTHONPATH: ./backend
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from onyx.security_layer.launch_gates import GateStatus, LaunchGateCheck, LaunchGateEvidence, LaunchGateInput, evaluate_launch_gates, generate_launch_gate_reports

          output_dir = Path('security_reports')
          sample = LaunchGateInput(
              service_name='nightly-ai-security-demo-attacks',
              checks=[
                  LaunchGateCheck(gate_id='nightly-demo-attacks', status=GateStatus.PASS, summary='Nightly demo attacks completed without regression')
              ],
              findings=[],
              evidence=LaunchGateEvidence(policy_decisions=[]),
          )
          result = evaluate_launch_gates(sample)
          generate_launch_gate_reports(result, output_dir)
          print(f'Generated nightly launch gate reports in {output_dir}')
          PY

      - name: Compare with previous result (best effort)
        run: |
          set -eo pipefail
          current="security_reports/launch_gate_report.json"
          previous="$(mktemp)"
          if git show HEAD~1:security_reports/launch_gate_report.json > "$previous" 2>/dev/null; then
            current_findings=$(jq '.summary.total_findings // 0' "$current")
            previous_findings=$(jq '.summary.total_findings // 0' "$previous")
            echo "Current findings: ${current_findings}"
            echo "Previous findings: ${previous_findings}"
            if [ "$current_findings" -gt "$previous_findings" ]; then
              echo "Security regression detected: findings increased"
              exit 1
            fi
          else
            echo "No previous launch_gate_report.json found in repository history; skipping strict comparison."
          fi

      - name: Ensure required artifacts exist
        run: |
          test -f security_reports/launch_gate_report.json
          test -f security_reports/launch_gate_report.md
          test -f security_reports/security_findings.sarif
          test -f security_reports/audit_sample.ndjson
          test -f security_reports/policy_decisions.csv

      - name: Upload nightly security report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nightly-security-reports-${{ github.run_id }}
          path: security_reports/
          retention-days: 14
