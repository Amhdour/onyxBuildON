policy_id: tools_policy
mode: observe

tool_risk_classes:
  read_only: allow
  retrieval: allow
  web_access: allow
  file_read: allow
  file_write: require_approval
  external_write: require_approval
  code_execution: require_approval
  data_export: require_approval
  admin_action: deny
  credential_access: deny
  deployment: deny

denied_argument_patterns:
  - AWS_SECRET_ACCESS_KEY
  - OPENAI_API_KEY
  - BEGIN PRIVATE KEY
  - /.ssh/
  - /.aws/
  - /etc/passwd
  - printenv
  - env

rules: []
